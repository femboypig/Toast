name: Build Toast iOS (Unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration'
        required: true
        default: 'release_arm64'
        type: choice
        options:
          - release_arm64
          - debug_arm64
          - release_sim_arm64
          - debug_sim_arm64
      os:
        description: 'macOS Runner'
        required: true
        default: 'macos-26'
        type: choice
        options:
          - macos-26
          - macos-15
          - macos-14
      create_release:
        description: 'Create a GitHub Release with the IPA'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build Toast (${{ inputs.configuration }})
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          SELECTED_XCODE=""
          for app in /Applications/Xcode_26*.app /Applications/Xcode*.app; do
            if [ -d "$app" ]; then
              if DEVELOPER_DIR="$app/Contents/Developer" xcrun --show-sdk-path --sdk iphoneos >/dev/null 2>&1; then
                SELECTED_XCODE="$app"
                echo "Found Xcode with iPhoneOS SDK: $app"
                break
              fi
            fi
          done

          if [ -n "$SELECTED_XCODE" ]; then
            sudo xcode-select -s "$SELECTED_XCODE"
          else
            for app in /Applications/Xcode_26*.app /Applications/Xcode.app; do
              if [ -d "$app" ]; then
                sudo xcode-select -s "$app"
                break
              fi
            done
            echo "Downloading iOS platform runtime..."
            sudo xcodebuild -downloadPlatform iOS || true
          fi

          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos || true

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build Toast App
        run: |
          set -x
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset 2>/dev/null || echo 0)"
          APP_VERSION=$(python3 -c 'import json; f=open("versions.json"); print(json.load(f)["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1000)
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # Import fake certificates into temporary keychain
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          EXTRA_ARGS=""
          if [[ "${{ inputs.configuration }}" == *"sim"* ]]; then
            EXTRA_ARGS="--disableProvisioningProfiles"
          fi

          # Build unsigned IPA using Bazel & Make.py
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-system/toast-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            $EXTRA_ARGS \
            --configuration="${{ inputs.configuration }}" \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts"

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          mkdir -p "$OUTPUT_PATH"

          # Fallback check if IPA was generated directly in bazel-out / bazel-bin
          if [ ! -f "$OUTPUT_PATH/Toast.ipa" ]; then
            for f in $(find bazel-out bazel-bin -name "Telegram.ipa" -o -name "Toast.ipa" 2>/dev/null); do
              cp "$f" "$OUTPUT_PATH/Toast.ipa"
              break
            done
          fi

          # Collect DSYMs
          mkdir -p "$SOURCE_DIR/build/DSYMs"
          for f in $(find bazel-out bazel-bin -name "*.dSYM" 2>/dev/null); do
            cp -R "$f" "$SOURCE_DIR/build/DSYMs/"
          done
          if [ -d "$SOURCE_DIR/build/DSYMs" ] && [ "$(ls -A "$SOURCE_DIR/build/DSYMs")" ]; then
            zip -rq "$OUTPUT_PATH/Toast.DSYMs.zip" "$SOURCE_DIR/build/DSYMs"
          fi

      - name: Upload Toast IPA & DSYM
        uses: actions/upload-artifact@v4
        with:
          name: Toast-${{ inputs.configuration }}-${{ env.BUILD_NUMBER }}
          path: |
            /Users/Shared/telegram-ios/build/artifacts/Toast.ipa
            /Users/Shared/telegram-ios/build/artifacts/Toast.DSYMs.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Toast ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned build of Toast iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Toast.ipa
            /Users/Shared/telegram-ios/build/artifacts/Toast.DSYMs.zip
          draft: false
          prerelease: false
